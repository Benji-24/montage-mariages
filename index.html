<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Montage Mariage</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#2b2622;--muted:#8a8178;--accent:#b08d57;--line:#ece5da}
@media (prefers-color-scheme:dark){:root{--bg:#141210;--card:#1e1b18;--ink:#f3eee7;--muted:#9c938a;--accent:#d2b07a;--line:#2e2a25}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;padding:28px 16px 60px;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto}
h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:40px;margin:8px 0 4px;text-align:center}
.sub{text-align:center;color:var(--muted);margin:0 0 24px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.step{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:10px}
label.file{display:block;border:1.5px dashed var(--line);border-radius:14px;padding:18px;text-align:center;cursor:pointer;color:var(--muted);font-size:15px;word-break:break-word}
label.file.ok{border-color:var(--accent);color:var(--ink)}
input[type=file]{display:none}
.row{display:flex;justify-content:space-between;align-items:center;margin:14px 0 6px;font-size:15px}
.row b{color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
.tog{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:15px}
.tog input{width:22px;height:22px;accent-color:var(--accent)}
button{width:100%;padding:16px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-size:17px;font-weight:600;margin-top:6px;font-family:inherit}
button:disabled{opacity:.4}
button.ghost{background:transparent;border:1.5px solid var(--accent);color:var(--accent);margin-top:10px}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.status{font-size:14px;color:var(--muted);margin-top:8px;min-height:20px}
canvas#tl{width:100%;height:34px;margin-top:12px;border-radius:6px;display:block}
#stage,#out{width:100%;border-radius:12px;background:#000;margin-top:12px;display:block}
.hidden{display:none!important}
#vids{position:fixed;left:0;top:0;width:2px;height:2px;opacity:.01;pointer-events:none;overflow:hidden}
#vids video{width:2px;height:2px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
</style>
</head>
<body>
<main>
  <h1>Montage Mariage</h1>
  <p class="sub">Ta longue vidéo → un film doux et cinématique</p>

  <div class="card">
    <div class="step">1 · Ta vidéo</div>
    <label class="file" id="vlab">Appuie pour choisir ta vidéo<input type="file" id="vfile" accept="video/*"></label>
  </div>

  <div class="card">
    <div class="step">2 · Musique (optionnel)</div>
    <label class="file" id="mlab">Appuie pour choisir une musique<input type="file" id="mfile" accept="audio/*"></label>
  </div>

  <div class="card">
    <div class="step">3 · Réglages</div>
    <div class="row"><span>Durée max</span><b id="durv">1 min 30</b></div>
    <input type="range" id="dur" min="30" max="90" step="5" value="90">
    <div class="row"><span>Ralenti</span><b id="speedv">65 %</b></div>
    <input type="range" id="speed" min="50" max="100" step="5" value="65">
    <label class="tog"><input type="checkbox" id="bars" checked> Bandes noires cinéma</label>
    <label class="tog"><input type="checkbox" id="grade" checked> Couleurs douces (style film)</label>
  </div>

  <div class="card">
    <div class="step">4 · Analyse des plans</div>
    <button id="analyze" disabled>Analyser la vidéo</button>
    <div class="bar"><i id="abar"></i></div>
    <div class="status" id="astat"></div>
    <canvas id="tl" class="hidden"></canvas>
    <div class="legend hidden" id="legend"><span style="--c:var(--line)">Plans</span><span style="--c:var(--accent)">Moments gardés</span></div>
  </div>

  <div class="card">
    <div class="step">5 · Le montage</div>
    <button id="render" disabled>Créer le montage</button>
    <div class="bar"><i id="rbar"></i></div>
    <div class="status" id="rstat"></div>
    <canvas id="stage" class="hidden"></canvas>
    <video id="out" class="hidden" controls playsinline></video>
    <button id="share" class="hidden">Enregistrer / partager la vidéo</button>
  </div>
</main>
<div id="vids"></div>

<script>
const $=id=>document.getElementById(id);
const STEP=0.25; // une image analysée toutes les 0,25 s
let videoURL=null,musicBuf=null,analysis=null,plan=null,ac=null,outFile=null,wake=null;

function getAC(){if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();return ac}
async function keepAwake(){try{wake=await navigator.wakeLock.request('screen')}catch(e){}}
function release(){try{wake&&wake.release()}catch(e){}wake=null}
function fmt(s){s=Math.round(s);const m=Math.floor(s/60),r=s%60;return m?`${m} min ${r?String(r).padStart(2,'0'):''}`.trim():`${r} s`}
function once(el,ev,ms=4000){return new Promise(r=>{let d=false;const f=()=>{if(d)return;d=true;el.removeEventListener(ev,f);r()};el.addEventListener(ev,f);setTimeout(f,ms)})}
async function seek(v,t){const p=once(v,'seeked');v.currentTime=t;await p}
function makeVideo(){const v=document.createElement('video');v.muted=true;v.playsInline=true;v.setAttribute('playsinline','');v.preload='auto';v.src=videoURL;$('vids').appendChild(v);return v}
function pct(arr,p){const a=Array.from(arr).filter(Number.isFinite).sort((x,y)=>x-y);return a.length?a[Math.min(a.length-1,Math.floor(p*a.length))]:1}

$('dur').oninput=()=>{$('durv').textContent=fmt(+$('dur').value);refresh()};
$('speed').oninput=()=>{const s=+$('speed').value;$('speedv').textContent=s===100?'Aucun':s+' %';refresh()};

$('vfile').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  if(videoURL)URL.revokeObjectURL(videoURL);
  videoURL=URL.createObjectURL(f);
  $('vlab').firstChild.textContent='✓ '+f.name;$('vlab').classList.add('ok');
  analysis=null;plan=null;$('analyze').disabled=false;$('render').disabled=true;
  $('tl').classList.add('hidden');$('legend').classList.add('hidden');$('astat').textContent='';$('abar').style.width='0';
};
$('mfile').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  $('mlab').firstChild.textContent='Chargement…';
  try{musicBuf=await getAC().decodeAudioData(await f.arrayBuffer());$('mlab').firstChild.textContent='✓ '+f.name;$('mlab').classList.add('ok')}
  catch(err){musicBuf=null;$('mlab').firstChild.textContent='Musique illisible, essaie un mp3 ou m4a'}
};

/* ---------- 4. ANALYSE ---------- */
$('analyze').onclick=async()=>{
  $('analyze').disabled=true;$('render').disabled=true;keepAwake();
  $('astat').textContent='Ouverture de la vidéo…';
  const v=makeVideo();
  await once(v,'loadedmetadata',15000);
  try{await v.play()}catch(e){} v.pause();
  const dur=v.duration;
  if(!dur||!isFinite(dur)){$('astat').textContent='Impossible de lire cette vidéo.';$('analyze').disabled=false;return}
  const W=160,H=Math.max(2,Math.round(160*(v.videoHeight||9)/(v.videoWidth||16)));
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const ctx=c.getContext('2d',{willReadFrequently:true});
  const n=Math.floor(dur/STEP);
  const diff=new Float32Array(n),sharp=new Float32Array(n),bright=new Float32Array(n);
  let prev=null;const t0=performance.now();
  for(let i=0;i<n;i++){
    await seek(v,i*STEP+0.01);
    ctx.drawImage(v,0,0,W,H);
    const d=ctx.getImageData(0,0,W,H).data;
    const g=new Float32Array(W*H);let sum=0;
    for(let p=0,q=0;q<g.length;p+=4,q++){const y=.299*d[p]+.587*d[p+1]+.114*d[p+2];g[q]=y;sum+=y}
    bright[i]=sum/g.length;
    let m=0,m2=0,cnt=0; // netteté (variance du laplacien)
    for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const k=y*W+x;const l=4*g[k]-g[k-1]-g[k+1]-g[k-W]-g[k+W];m+=l;m2+=l*l;cnt++}
    m/=cnt;sharp[i]=m2/cnt-m*m;
    if(prev){let s=0;for(let q=0;q<g.length;q++)s+=Math.abs(g[q]-prev[q]);diff[i]=s/g.length}
    prev=g;
    if(i%6===0){
      const el=(performance.now()-t0)/1000,left=el/(i+1)*(n-i-1);
      $('abar').style.width=(i/n*100)+'%';
      $('astat').textContent=`Analyse des images… ${Math.round(i/n*100)} % · encore ~${fmt(left)}`;
    }
  }
  v.remove();
  $('abar').style.width='100%';
  analysis={dur,n,diff,sharp,bright};
  refresh();
  $('analyze').disabled=false;release();
};

function buildPlan(){
  const {n,diff,sharp,bright}=analysis;
  // détection des changements de plan
  const cuts=[0];
  for(let i=1;i<n;i++){
    const nb=[];for(let j=Math.max(1,i-8);j<=Math.min(n-1,i+8);j++)if(j!==i)nb.push(diff[j]);
    nb.sort((a,b)=>a-b);const med=nb[nb.length>>1]||0;
    if(diff[i]>Math.max(22,med*3.5)&&i-cuts[cuts.length-1]>=4)cuts.push(i);
  }
  cuts.push(n);
  const shots=[];for(let s=0;s<cuts.length-1;s++)shots.push([cuts[s],cuts[s+1]]);
  const mRef=pct(diff.subarray(1),.75)||1,sRef=pct(sharp,.8)||1;
  const speed=+$('speed').value/100,D=2.4,T=D/speed,F=.9,target=+$('dur').value;
  const K=Math.max(1,Math.floor((target-T)/(T-F))+1);
  const N=Math.round(D/STEP);
  const cands=[];
  shots.forEach(([a,b],si)=>{
    for(let i=a+2;i+N<=b-2;i+=2){ // on évite les 0,5 s au bord de chaque plan
      let ms=0,ss=0,bs=0,jerk=0,mx=0;
      for(let j=i+1;j<i+N;j++){const mv=diff[j]/mRef;ms+=mv;mx=Math.max(mx,mv);jerk+=Math.abs(diff[j]-diff[j-1])/mRef}
      for(let j=i;j<i+N;j++){ss+=Math.min(1.3,sharp[j]/sRef);bs+=bright[j]}
      ms/=N-1;jerk/=N-1;ss/=N;bs/=N;
      const expo=Math.abs(bs-125)/125;
      // net + stable + fluide + bien exposé = bon score
      const score=ss*1.2-ms-jerk*.8-Math.max(0,mx-1.5)*.6-expo*.8;
      cands.push({si,t:i*STEP,score,mx});
    }
  });
  cands.sort((x,y)=>y.score-x.score);
  const chosen=[],per={};
  for(const c of cands){
    if(chosen.length>=K)break;
    if(c.mx>3.5)continue; // raté / mouvement brusque
    const [a,b]=shots[c.si],cap=1+Math.floor((b-a)*STEP/12);
    if((per[c.si]||0)>=cap)continue;
    if(chosen.some(o=>Math.abs(o.t-c.t)<D+1.5))continue;
    chosen.push(c);per[c.si]=(per[c.si]||0)+1;
  }
  chosen.sort((x,y)=>x.t-y.t);
  const total=chosen.length?(chosen.length-1)*(T-F)+T:0;
  return {shots,chosen,D,T,F,speed,total};
}

function refresh(){
  if(!analysis)return;
  plan=buildPlan();
  $('astat').textContent=plan.chosen.length
    ?`${plan.shots.length} plans détectés · ${plan.chosen.length} beaux moments gardés · film de ${fmt(plan.total)}`
    :'Aucun moment assez stable trouvé.';
  $('render').disabled=!plan.chosen.length;
  drawTimeline();
}

function drawTimeline(){
  const c=$('tl');c.classList.remove('hidden');$('legend').classList.remove('hidden');
  const dpr=window.devicePixelRatio||1,w=c.clientWidth*dpr,h=34*dpr;c.width=w;c.height=h;
  const x=c.getContext('2d'),cs=getComputedStyle(document.documentElement);
  const line=cs.getPropertyValue('--line').trim(),acc=cs.getPropertyValue('--accent').trim(),mut=cs.getPropertyValue('--muted').trim();
  const sx=w/analysis.n;
  plan.shots.forEach(([a,b],i)=>{x.fillStyle=line;x.globalAlpha=i%2?.6:1;x.fillRect(a*sx,0,(b-a)*sx-1,h)});
  x.globalAlpha=1;x.fillStyle=acc;
  plan.chosen.forEach(c=>x.fillRect(c.t/STEP*sx,h*.2,Math.max(2,plan.D/STEP*sx),h*.6));
}

/* ---------- 5. MONTAGE ---------- */
$('render').onclick=async()=>{
  if(!plan||!plan.chosen.length)return;
  $('render').disabled=true;$('analyze').disabled=true;$('share').classList.add('hidden');$('out').classList.add('hidden');
  keepAwake();
  const {chosen,T,F,speed}=plan;
  const A=getAC();try{await A.resume()}catch(e){}
  $('rstat').textContent='Préparation…';
  const vids=[makeVideo(),makeVideo()];
  await Promise.all(vids.map(v=>once(v,'loadedmetadata',15000)));
  for(const v of vids){try{await v.play()}catch(e){}v.pause();v.defaultPlaybackRate=speed;v.playbackRate=speed}
  const vw=vids[0].videoWidth,vh=vids[0].videoHeight,sc=Math.min(1,1920/Math.max(vw,vh));
  const cw=Math.round(vw*sc/2)*2,ch=Math.round(vh*sc/2)*2;
  const cv=$('stage');cv.width=cw;cv.height=ch;cv.classList.remove('hidden');
  const ctx=cv.getContext('2d');
  const bars=$('bars').checked&&cw>ch,grade=$('grade').checked;
  const starts=chosen.map((c,k)=>k*(T-F)),total=starts[starts.length-1]+T;
  const trans=chosen.map((c,k)=>[0,1,0,2][k%4]); // fondu, fondu flou, fondu, fondu blanc
  const vig=ctx.createRadialGradient(cw/2,ch/2,Math.min(cw,ch)*.35,cw/2,ch/2,Math.hypot(cw,ch)/2);
  vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(0,0,0,.38)');

  const stream=cv.captureStream(30);let src=null,gain=null;
  if(musicBuf){
    const dest=A.createMediaStreamDestination();
    src=A.createBufferSource();src.buffer=musicBuf;src.loop=true;
    gain=A.createGain();src.connect(gain);gain.connect(dest);
    dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));
  }
  const mime=['video/mp4;codecs=avc1,mp4a','video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m))||'';
  const rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:12e6}:{});
  const chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  const stopped=new Promise(r=>rec.onstop=r);

  await seek(vids[0],chosen[0].t);if(chosen[1])await seek(vids[1],chosen[1].t);
  const st=chosen.map((c,k)=>({prep:k<2,play:false}));
  ctx.fillStyle='#000';ctx.fillRect(0,0,cw,ch);
  rec.start(1000);
  const t0=performance.now()/1000;
  if(src){const now=A.currentTime;gain.gain.setValueAtTime(0,now);gain.gain.linearRampToValueAtTime(1,now+1.5);gain.gain.setValueAtTime(1,now+Math.max(1.5,total-3));gain.gain.linearRampToValueAtTime(0,now+total);src.start()}

  const baseF=grade?'contrast(1.06) saturate(0.9) brightness(1.03) sepia(0.08)':'';
  function clip(k,t,alpha,blur){
    const v=vids[k%2],p=Math.min(1,Math.max(0,(t-starts[k])/T));
    const z=k%2?1.09-.06*p:1.03+.06*p; // léger zoom lent
    const f=(baseF+(blur>.3?` blur(${blur.toFixed(1)}px)`:'')).trim();
    ctx.filter=f||'none';ctx.globalAlpha=alpha;
    ctx.drawImage(v,(cw-cw*z)/2,(ch-ch*z)/2,cw*z,ch*z);
  }
  function white(a){ctx.filter='none';ctx.globalAlpha=a;ctx.fillStyle='#fffaf2';ctx.fillRect(0,0,cw,ch)}

  await new Promise(done=>{
    function frame(){
      const t=performance.now()/1000-t0;
      chosen.forEach((c,k)=>{
        const v=vids[k%2];
        if(!st[k].prep&&t>=starts[k-2]+T){st[k].prep=true;v.pause();v.currentTime=c.t}
        if(st[k].prep&&!st[k].play&&t>=starts[k]){st[k].play=true;v.playbackRate=speed;v.play().catch(()=>{})}
      });
      const act=[];for(let k=0;k<chosen.length;k++)if(t>=starts[k]&&t<starts[k]+T)act.push(k);
      if(act.length&&act.every(k=>vids[k%2].readyState>=2)){
        ctx.filter='none';ctx.globalAlpha=1;ctx.fillStyle='#000';ctx.fillRect(0,0,cw,ch);
        if(act.length===1)clip(act[0],t,1,0);
        else{
          const [a,b]=act;let e=Math.min(1,(t-starts[b])/F);e=e*e*(3-2*e);
          const ty=trans[b];
          if(ty===0){clip(a,t,1,0);clip(b,t,e,0)}
          else if(ty===1){const bl=Math.sin(Math.PI*e)*6;clip(a,t,1,bl);clip(b,t,e,bl)}
          else if(e<.5){clip(a,t,1,0);white(e*1.8)}else{clip(b,t,1,0);white((1-e)*1.8)}
        }
        ctx.filter='none';ctx.globalAlpha=1;ctx.fillStyle=vig;ctx.fillRect(0,0,cw,ch);
        if(bars){const bh=Math.round((ch-cw/2.39)/2);if(bh>0){ctx.fillStyle='#000';ctx.fillRect(0,0,cw,bh);ctx.fillRect(0,ch-bh,cw,bh)}}
        const fade=Math.min(1,t/1.2,(total-t)/1.8);
        if(fade<1){ctx.globalAlpha=1-Math.max(0,fade);ctx.fillStyle='#000';ctx.fillRect(0,0,cw,ch);ctx.globalAlpha=1}
      }
      $('rbar').style.width=Math.min(100,t/total*100)+'%';
      $('rstat').textContent=`Création du film… ${fmt(Math.min(t,total))} / ${fmt(total)} · garde l'écran allumé`;
      if(t>=total){done();return}
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });

  vids.forEach(v=>{v.pause();v.remove()});
  try{src&&src.stop()}catch(e){}
  rec.stop();await stopped;release();
  const type=(mime||'video/mp4').split(';')[0],ext=type.includes('webm')?'webm':'mp4';
  const blob=new Blob(chunks,{type});
  outFile=new File([blob],'montage-mariage.'+ext,{type});
  cv.classList.add('hidden');
  const o=$('out');o.src=URL.createObjectURL(blob);o.classList.remove('hidden');
  $('share').classList.remove('hidden');
  $('rstat').textContent='Terminé ! Regarde ton film puis enregistre-le 🎬';
  $('render').disabled=false;$('analyze').disabled=false;
};

$('share').onclick=async()=>{
  if(!outFile)return;
  if(navigator.canShare&&navigator.canShare({files:[outFile]})){
    try{await navigator.share({files:[outFile],title:'Montage mariage'})}catch(e){}
  }else{
    const a=document.createElement('a');a.href=URL.createObjectURL(outFile);a.download=outFile.name;a.click();
  }
};
</script>
</body>
</html>
